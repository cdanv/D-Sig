var $=function(s){return document.getElementById(s)};
// 1.0.18: navigator.clipboard so existe em contexto seguro. Abrindo o index.html direto
// do disco (file://) ele e undefined, e o botao Copiar lancava TypeError sem mostrar
// nada. A reserva e o execCommand sobre um textarea temporario; se nem ela funcionar, o
// botao diz que falhou em vez de ficar mudo.
function copiar(txt,feito,falhou){
  function reserva(){
    var ok=false, ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(ok)feito();else falhou()}
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(feito,reserva);
  else reserva()}
function botaoCopia(b,rot,txt){
  b.onclick=function(){copiar(typeof txt==='function'?txt():txt,
    function(){b.textContent='Copiado';setTimeout(function(){b.textContent=rot},1400)},
    function(){b.textContent='Não copiou — selecione e copie à mão';
      setTimeout(function(){b.textContent=rot},2600)})}}
function baixar(nome,txt,tipo){
  var u=URL.createObjectURL(new Blob([txt],{type:tipo||'text/plain'}));
  var a=document.createElement('a');a.href=u;a.download=nome;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function h(x){return String(x).replace(/[&<>"]/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sel(v,arr,cb){var s=document.createElement('select');
  arr.forEach(function(o,k){var e=document.createElement('option');
    e.value=k;e.textContent=o;if(k===v)e.selected=true;s.appendChild(e)});
  s.onchange=function(){cb(+s.value)};return s}
// Acessibilidade (achado da auditoria): num app que existe POR acessibilidade, um select
// sem rotulo associado e um botao sem nome sao lidos como "botao" pelo leitor de tela.
// Aqui o rotulo do campo vira o nome acessivel do controle, inclusive quando o controle
// e um grupo de botoes.
var _fldId=0;
// O 3o argumento e o NOME ACESSIVEL, quando o rotulo visivel nao basta sozinho. Dois
// casos: sub-campo do GAMA, onde "· tempo" nao diz de qual alternativa e; e controle que
// vai dentro de um <div> (a cor do LED), que caia no caminho do grupo e ficava sem nome
// proprio — o leitor de tela anunciava so o valor.
function fld(rot,ctl,nomeAcc){var d=document.createElement('div');d.className='fld';
  _fldId++;var id='f'+_fldId;
  d.innerHTML='<label id="'+id+'">'+rot+'</label>';
  var c=document.createElement('div');c.className='ctl';
  var nat=(ctl.tagName==='SELECT'||ctl.tagName==='INPUT'||ctl.tagName==='TEXTAREA');
  if(nat)ctl.setAttribute('aria-labelledby',id);
  else { c.setAttribute('role','group'); c.setAttribute('aria-labelledby',id); }
  if(nomeAcc){
    var alvo=nat?ctl:(ctl.querySelector('select,input,textarea,button')||c);
    alvo.setAttribute('aria-label',nomeAcc);
  }
  c.appendChild(ctl);d.appendChild(c);return d}
function chk(v,cb){var b=document.createElement('button');b.className='btn sm';
  b.textContent=v?'sim':'não';b.style.minWidth='58px';
  b.setAttribute('role','switch');b.setAttribute('aria-checked',v?'true':'false');
  if(v)b.style.borderColor='var(--azul)';b.onclick=function(){cb(!v)};return b}

// 1.0.18: O FOCO SOBREVIVE AO REDESENHO. Toda alteracao refaz a tela inteira, e o
// elemento que tinha o foco deixava de existir: quem navega por teclado ou leitor de tela
// voltava ao topo da pagina a cada campo alterado. Se a tela e a mesma, o foco volta ao
// controle que ocupa a mesma posicao — e so se ele for do mesmo tipo, para nao pousar em
// outro campo quando a alteracao acrescentou ou tirou linhas acima.
// 1.0.19: O VOLTAR DO SISTEMA. A navegacao do app era so uma variavel (tela) e nunca
// entrava no historico do navegador: para o Android havia UMA pagina, e o gesto ou o
// botao de voltar saia dela — fechava o app, de qualquer tela. Agora cada nivel de tela
// e uma entrada do historico:
//     0  lista de jogos        1  jogo / exportar / informacoes        2  MOD / codigo
// O render() mantem o historico na profundidade da tela (empurra ao descer, recua ao
// subir pelo "‹" do app), e o voltar do sistema chega como popstate e sobe um nivel.
// Na lista de jogos nao ha entrada para voltar: ali o voltar fecha o app, como deve.
// HIST e a profundidade que o historico tem; _histEsp conta os recuos pedidos por nos,
// cujo popstate nao e um voltar do usuario. Enquanto ha um recuo em curso nada e
// empurrado — history.go() e assincrono, e empurrar no meio dele pousaria no lugar errado.
var HIST=0, _histEsp=0;
function profTela(){return tela==='cat'?0:(tela==='mod'||tela==='cod')?2:1}
function sobeTela(){tela=(tela==='mod'||tela==='cod')?'jogo':'cat';modo=''}
function histSync(){
  if(_histEsp)return;
  var p=profTela();
  try{
    while(HIST<p){HIST++;history.pushState({d:HIST},'')}
    if(HIST>p){var n=HIST-p;HIST=p;_histEsp++;history.go(-n)}
  }catch(e){}}
try{HIST=(history.state&&typeof history.state.d==='number')?history.state.d:0;
  if(!HIST)history.replaceState({d:0},'')}catch(e){}
window.addEventListener('popstate',function(ev){
  var d=(ev.state&&typeof ev.state.d==='number')?ev.state.d:0;
  HIST=d;
  if(_histEsp){_histEsp--;histSync();return}     // recuo nosso: so acerta a conta
  if(d>profTela()){histSync();return}            // "avancar": a tela de la nao existe mais
  while(profTela()>d)sobeTela();
  render()});
var FOCAVEL='select,input,textarea,button';
var _telaAnt='';
function render(){
  var A=$('app'), at=document.activeElement, pos=-1, tag='', chave=tela+'/'+jg+'/'+md;
  if(at&&A.contains(at)&&chave===_telaAnt){
    pos=Array.prototype.indexOf.call(A.querySelectorAll(FOCAVEL),at);tag=at.tagName}
  _telaAnt=chave;
  A.innerHTML='';
  $('volta').style.display=tela==='cat'?'none':'block';
  $('logo').style.display=tela==='cat'?'block':'none';
  if(tela==='cat')telaCat(A);
  else if(tela==='jogo')telaJogo(A);
  else if(tela==='mod')telaMod(A);
  else if(tela==='cod')telaCod(A);
  else if(tela==='dados')telaDados(A);
  else if(tela==='info')telaInfo(A);
  histSync();
  if(pos>=0){var novo=A.querySelectorAll(FOCAVEL)[pos];
    if(novo&&novo.tagName===tag&&!novo.disabled){
      try{novo.focus({preventScroll:true})}catch(e){novo.focus()}}}
}

// APAGAR UM MOD, com a MESMA semantica do script. Ate a 1.0e isto era
// `j.mods[md]=modVazio()`, e as consequencias foram medidas, nao supostas:
//
//  1. NAO COMPACTAVA. O script apaga com Compactar_Lista: o MOD_11 vira MOD_10 e a lista
//     fica contigua. O app so zerava o slot e deixava BURACO. Com buraco, o
//     Count_Instances do script conta 16 usados, o Print_Inst_Row desenha as linhas 1 a
//     16, a linha do slot vazio sai em branco e O ULTIMO MOD RODA MAS FICA FORA DA
//     LISTA — inalcancavel para editar ou apagar pelo OLED. Verificado gerando o script
//     depois de apagar: os slots usados sairam 1..9, 11..17.
//  2. NAO AJUSTAVA AS REFERENCIAS. O script usa Shift_Mask_Del: tira o bit do apagado e
//     desce os de cima. O app deixava os indices velhos, e um ZETA passava a apontar
//     para o MOD errado depois da compactacao.
//  3. NAO SAIA DA TELA. Ficava no editor do MOD, agora em branco, com o titulo ainda
//     dizendo "MOD_10". Funcionava e parecia nao funcionar — foi assim que o bug foi
//     relatado como "a funcao de deletar nao esta respondendo".
// COPIAR E COLAR UM MOD (1.0.20).
// Muitos MODs de um jogo sao quase iguais; copiar um e mexer em dois campos e o caminho
// natural. A copia fica na memoria do app (some ao fechar) e pode ser colada no mesmo
// jogo ou em outro, quantas vezes se quiser. Quatro cuidados, cada um contra um defeito
// que a versao ingenua — "j.mods[k] = COPIA" — teria:
//
//  1. A COPIA E INDEPENDENTE. E um clone tirado NA HORA de copiar, e cada colagem e outro
//     clone. Sem isso o original e a copia seriam o mesmo objeto, e editar um editava o
//     outro; e o que se colasse seria o MOD como esta agora, nao como estava ao copiar.
//  2. O ZETA E GUARDADO POR MOD, NAO POR NUMERO. Entre copiar e colar da para apagar ou
//     reordenar MODs, e o numero guardado passaria a apontar para outro. A copia guarda
//     os PROPRIOS MODs-alvo, e na colagem pergunta em que posicao cada um esta hoje;
//     alvo que foi apagado simplesmente sai.
//  3. EM OUTRO JOGO O ZETA NAO VAI. La os numeros apontariam para MODs que nao tem nada
//     a ver. A colagem avisa quantas relacoes ficaram para tras.
//  4. COLA NA PRIMEIRA VAGA, e nao no fim nem onde o usuario escolher: a lista nao pode
//     ter buraco (ver apagarMod, abaixo). Sem vaga — 20 MODs — nao cola e diz por que.
//     Relacao perdida de outro MOD que ainda apontasse para a vaga e limpa, para nao
//     passar a apontar para a copia sem ninguem ter pedido.
var COPIA=null;
function copiaMod(j,i){
  var m=j.mods[i], alvos={};
  ['excl','assoc','bloq'].forEach(function(r){alvos[r]=m[r].map(function(t){return j.mods[t]})});
  COPIA={mod:JSON.parse(JSON.stringify(m)),jogo:j,alvos:alvos,
    de:'MOD_'+String(i+1).padStart(2,'0')+(j.nome?' de '+j.nome:'')}}
function vagaMod(j){for(var k=0;k<NMOD;k++)if(!nomeMod(j,k))return k;return -1}
// Devolve {i: posicao onde colou, semZeta: relacoes que nao vieram} ou null se nao colou.
function colaMod(j){
  if(!COPIA)return null;
  var k=vagaMod(j);
  if(k<0)return null;
  var m=JSON.parse(JSON.stringify(COPIA.mod)), fora=0;
  var mesmo=(COPIA.jogo===j&&D.jogos.indexOf(j)>=0);
  ['excl','assoc','bloq'].forEach(function(r){var v=[];
    COPIA.alvos[r].forEach(function(o){
      var t=mesmo?j.mods.indexOf(o):-1;
      if(t>=0&&t!==k&&nomeMod(j,t)&&v.indexOf(t)<0)v.push(t);else fora++});
    m[r]=v});
  if(m.nota&&!/\(cópia\)$/.test(m.nota))m.nota+=' (cópia)';
  j.mods.forEach(function(o){['excl','assoc','bloq'].forEach(function(r){
    if(o[r].indexOf(k)>=0)o[r]=o[r].filter(function(t){return t!==k})})});
  j.mods[k]=normMod(m,k);
  return{i:k,semZeta:fora}}

function apagarMod(j,i){
  // as relacoes: fora o apagado, e quem estava acima desce um
  j.mods.forEach(function(o){['excl','assoc','bloq'].forEach(function(r){
    o[r]=o[r].filter(function(t){return t!==i}).map(function(t){return t>i?t-1:t})})});
  j.mods.splice(i,1);            // compacta
  j.mods.push(modVazio());       // e a lista continua com NMOD posicoes
}

// A versao e lida do TEMPLATE, nao escrita aqui. Se fosse uma constante do app, ela
// poderia discordar do script embutido — e foi justamente a duvida "o app atualizou?"
// que motivou colocar a versao na tela. Uma fonte, dois lugares que a mostram.
function versaoDSig(){
  var m=/const string DS_VERSAO\s*=\s*"([^"]+)";/.exec(
    document.getElementById('tpl').textContent);
  return m?m[1]:'D-Sig';
}
// O numero do layout tambem sai do template, pela mesma razao da versao: estava escrito
// aqui como "5" enquanto o cabecalho do script dizia 6.
function layoutDSig(){
  var m=/define LAYOUT_VER\s*=\s*(\d+);/.exec(document.getElementById('tpl').textContent);
  return m?m[1]:'?';
}

function telaDados(A){
  $('titulo').innerHTML='Exportar / importar';
  $('volta').onclick=function(){tela='cat';render()};
  var t=document.createElement('textarea');t.value=JSON.stringify(D);
  // Unico lugar onde a biblioteca inteira e copiada ou colada, e estava sem rotulo.
  t.setAttribute('aria-label','Backup da biblioteca, em JSON');
  t.setAttribute('spellcheck','false');A.appendChild(t);
  // 1.0.18: A IMPORTACAO SUBSTITUI A BIBLIOTECA INTEIRA, e fazia isso sem perguntar —
  // enquanto apagar UM jogo pede dois toques. Agora pergunta, dizendo quantos jogos saem
  // e quantos entram, sempre que o conteudo for diferente do que ja esta guardado.
  function importaTexto(txt){var n;
    try{n=JSON.parse(txt)}catch(e){alert('Texto inválido: não é JSON.');return}
    if(!n||!Array.isArray(n.jogos)){alert('Texto inválido: não parece um backup do D-Sig.');return}
    try{
      // A MESMA normalizacao da carga. Antes esta via fazia uma das sete, e backup de
      // versao antiga entrava corrompido — inclusive com 21 MODs, perdendo o MOD 21 sem
      // aviso e mudando o selo sozinho no recarregamento seguinte.
      PERDIDOS=[];
      normaliza(n);
      if(D.jogos.length&&JSON.stringify(n)!==JSON.stringify(D)&&
         !confirm('Importar SUBSTITUI a biblioteca deste navegador.\n\nSaem '+D.jogos.length+
           ' jogo(s), entram '+n.jogos.length+'. Continuar?'))return;
      D=n;grava(D);
      if(PERDIDOS.length)alert('O MOD 21 destes jogos foi removido: '+PERDIDOS.join(', '));
      tela='cat';render();
    }catch(e){alert('O backup foi lido, mas tem algo que eu não soube tratar:\n'+e.message)}}
  var r=document.createElement('div');r.className='row';
  var b1=document.createElement('button');b1.className='btn pri';b1.textContent='Copiar tudo';
  botaoCopia(b1,'Copiar tudo',function(){t.select();return t.value});
  var b2=document.createElement('button');b2.className='btn';b2.textContent='Importar do campo';
  b2.onclick=function(){importaTexto(t.value)};
  r.appendChild(b1);r.appendChild(b2);A.appendChild(r);
  // 1.0.18: O BACKUP COMO ARQUIVO. Copiar e colar um JSON de dezenas de KB no celular e
  // o tipo de passo que se adia — e este e o unico backup completo que existe. Baixar
  // gera um .json com a data; importar arquivo le o mesmo .json pelo caminho de cima.
  var ra=document.createElement('div');ra.className='row';
  var b4=document.createElement('button');b4.className='btn';b4.textContent='Baixar backup (.json)';
  b4.onclick=function(){var d=new Date(), z=function(v){return String(v).padStart(2,'0')};
    baixar('D-Sig_biblioteca_'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json',
      JSON.stringify(D),'application/json')};
  var fj=document.createElement('input');fj.type='file';fj.accept='.json,application/json';fj.hidden=true;
  fj.setAttribute('aria-label','Arquivo de backup da biblioteca (.json)');
  var b5=document.createElement('button');b5.className='btn';b5.textContent='Importar arquivo (.json)';
  b5.onclick=function(){fj.value='';fj.click()};
  fj.onchange=function(){var a=fj.files&&fj.files[0];if(!a)return;
    a.text().then(importaTexto,function(){alert('Não consegui ler este arquivo.')})};
  ra.appendChild(b4);ra.appendChild(b5);A.appendChild(ra);A.appendChild(fj);
  var p=document.createElement('p');p.className='hint';
  p.textContent='Guarde o arquivo (ou o texto) como backup. Para levar a outro aparelho, importe-o lá.';
  A.appendChild(p);
  // Backup do Cronus: o Zen Studio salva as SPVARs num .znbk. Elas viram um jogo NOVO
  // na biblioteca — nunca sobrescrevem um existente.
  var f=document.createElement('input');f.type='file';f.accept='.znbk';f.hidden=true;
  f.setAttribute('aria-label','Arquivo de backup do Cronus (.znbk)');
  var b3=document.createElement('button');b3.className='btn';b3.textContent='Importar backup do Cronus (.znbk)';
  b3.onclick=function(){f.value='';f.click()};
  f.onchange=function(){var a=f.files&&f.files[0];if(!a)return;
    a.arrayBuffer().then(function(buf){return lerZnbk(new Uint8Array(buf))}).then(function(sl){
      var r=importaZnbk(sl), msg;
      if(!r.jogos.length){alert('Nenhum slot deste backup tem MODs do D-Sig.'+
        (r.pulos.length?'\n\n'+r.pulos.join('\n'):''));return}
      r.jogos.forEach(function(x){D.jogos.push(x.jogo)});grava(D);
      msg='Importado(s) como jogo(s) novo(s):\n'+r.jogos.map(function(x){
        return '  '+x.jogo.nome+' — '+x.mods+' MOD(s)'}).join('\n');
      if(r.pulos.length)msg+='\n\nPulados:\n  '+r.pulos.join('\n  ');
      msg+='\n\nNão vêm do Cronus, porque não ficam na EEPROM: nome dos domínios, cores, '+
        'anotações, relações ZETA, GAMA BLOK, modo FINALIZA e gatilho que enxerga o DELTA. Confira esses antes de gerar o script.';
      alert(msg);tela='cat';render();
    }).catch(function(e){alert('Não consegui importar este backup:\n'+e.message)})};
  var r2=document.createElement('div');r2.className='row';r2.appendChild(b3);A.appendChild(r2);A.appendChild(f)}

render();

var _avisou=false;
function mostrarAviso(){
  if(_avisou)return; _avisou=true;
  var bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;'+
    'background:var(--azul);color:#04101f;padding:13px 16px;font-size:14px;'+
    'display:flex;align-items:center;gap:12px;font-weight:500';
  bar.innerHTML='<span style="flex:1">Nova versão disponível.</span>';
  var b=document.createElement('button');
  b.textContent='Atualizar';
  b.style.cssText='background:#04101f;color:#fff;border-radius:8px;padding:7px 14px;font-weight:600';
  // 1.0.18: recarregava 300 ms depois de pedir, torcendo para o service worker novo ja
  // ter assumido; num aparelho lento a pagina voltava ainda servida pelo antigo e o aviso
  // reaparecia. Agora recarrega quando o controlador TROCA, com 2 s de teto.
  b.onclick=function(){
    var foi=false;
    function vai(){if(foi)return;foi=true;location.reload()}
    navigator.serviceWorker.addEventListener('controllerchange',vai);
    navigator.serviceWorker.getRegistration().then(function(r){
      if(r && r.waiting) r.waiting.postMessage('assumir');
      setTimeout(vai,2000)},vai)};
  bar.appendChild(b);document.body.appendChild(bar)}

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller) mostrarAviso();
      reg.addEventListener('updatefound',function(){
        var novo=reg.installing;
        if(!novo)return;
        novo.addEventListener('statechange',function(){
          if(novo.state==='installed' && navigator.serviceWorker.controller) mostrarAviso()})})
    }).catch(function(){})})}
